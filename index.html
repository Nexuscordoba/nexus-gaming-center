<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Título que aparece en la pestaña y en Google -->
    <title>Nexus Gaming Center & Café Bar | Córdoba</title>
    
    <!-- Descripción corta para Google (Máximo 155 caracteres) -->
    <meta name="description" content="Descubre Nexus en Córdoba: Cafetería con menú diario, desayunos y el mayor centro de ocio gaming, torneos TCG y Escape Rooms en Polígono Chinales." />
    
    <!-- Palabras clave (Aunque Google ya casi no las usa, suma) -->
    <meta name="keywords" content="cafetería chinales, menú del día córdoba, centro gaming, juegos de mesa, torneos magic, cartas pokémon, escape room córdoba" />
    
    <!-- Etiquetas para cuando compartes el enlace por WhatsApp, Twitter o Facebook -->
    <meta property="og:title" content="Nexus Gaming Center & Café Bar | Córdoba" />
    <meta property="og:description" content="El nexo donde confluyen el juego y la comunidad. Cafetería, torneos y ocio en Chinales." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nexusgamingcenter.es/" />
    <!-- Idealmente, sube una foto general bonita de la fachada o el local a tu carpeta public y pon su ruta aquí para que salga en WhatsApp -->
    <meta property="og:image" content="https://www.nexusgamingcenter.es/foto-compartir.jpg" />

    <!-- Motor de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#08090d] text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
